name: Actualizar catálogo

on:
  schedule:
    - cron: "0 10 * * *"   # todos los días 07:00 hora Argentina
  workflow_dispatch:        # botón "Run workflow" para actualizar a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar propiedades y generar HTML
        run: |
          python3 build.py site/index.html site/propiedades.json
          cp robots.txt site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
